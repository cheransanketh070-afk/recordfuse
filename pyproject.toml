[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "recordfuse"
version = "0.2.0"
description = "Deterministic, explainable and safety-constrained entity resolution for messy multi-source records."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "RecordFuse Contributors"}]
keywords = ["entity-resolution", "record-linkage", "deduplication", "data-quality", "reconciliation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "pip-audit>=2.7,<3",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]

[project.scripts]
recordfuse = "recordfuse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=recordfuse --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true
source = ["recordfuse"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "RUF",
]

[tool.ruff.lint.isort]
known-first-party = ["recordfuse"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["recordfuse"]
warn_unused_ignores = true
