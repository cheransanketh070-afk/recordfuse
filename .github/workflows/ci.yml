name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install development dependencies
        run: |
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: |
          ruff check src tests

      - name: MyPy
        run: |
          mypy src/recordfuse

      - name: Dependency audit
        run: |
          pip-audit

      - name: Package consistency
        run: |
          python -m pip check

  tests:
    name: Tests - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install development dependencies
        run: |
          python -m pip install -e ".[dev]"

      - name: Run tests and coverage gate
        run: |
          pytest

  package:
    name: Build and verify package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip setuptools wheel build

      - name: Build package
        run: |
          python -m build

      - name: Verify wheel installation
        run: |
          python -m venv /tmp/recordfuse-verify
          /tmp/recordfuse-verify/bin/python -m pip install dist/*.whl
          /tmp/recordfuse-verify/bin/python -m pip check
          /tmp/recordfuse-verify/bin/recordfuse --version

      - name: Verify source archive
        run: |
          test -f dist/recordfuse-0.2.0.tar.gz
