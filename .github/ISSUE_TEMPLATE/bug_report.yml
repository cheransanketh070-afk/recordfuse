name: Bug report
description: Report reproducible incorrect behavior
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Include sanitized sample records and configuration.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: RecordFuse version
    validations:
      required: true
